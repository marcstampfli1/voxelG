[package]
name = "voxel"
version = "0.1.0"
edition = "2021"

[lib]
name = "voxelg"
path = "src/lib.rs"

[[bin]]
name = "voxel"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1

[dependencies]
libc = "0.2"
winit = "0.30"
# wgpu from GitHub trunk (pinned): procedural-AABB acceleration structures +
# ray_query, needed for the hardware ray-tracing rework, are not in any crates.io
# release yet. Pinned to a commit for reproducibility.
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "c97d22fff4411228546f37bc7c532c158a61dc6e" }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
env_logger = "0.11"
log = "0.4"
rayon = "1.10"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
# Compresses the bulk edit-log/snapshot a late joiner downloads (checklist: net compression).
flate2 = "1"

[dev-dependencies]
# Headless WGSL parse + validation (same rev as wgpu) so shader changes are
# caught by `cargo test` without opening a window or needing a GPU.
naga = { git = "https://github.com/gfx-rs/wgpu", rev = "c97d22fff4411228546f37bc7c532c158a61dc6e", features = ["wgsl-in"] }
# Microbenchmarks for the CPU hot paths (worldgen + picking raycast).
criterion = "0.5"
# PNG dump for the headless look-dev screenshots (visual iteration without
# opening a game window).
png = "0.17"

[[bench]]
name = "trace"
harness = false

# NOTE on the local wgpu fork.
#
# docs/rt/wgpu-prs/0003-scratch-buffer-reuse.patch (acceleration-structure build
# scratch reuse) is a prepared upstream PR, not yet landed. It is a wgpu-core
# INTERNAL change with no public API surface, so this crate builds identically
# with or without it -- the fork only makes a large AABB BLAS rebuild cost
# 1.2-2.0 ms of CPU per call instead of 12-28 ms (RT streaming updates only).
#
# The `[patch]` override therefore does NOT belong here: an absolute path to a
# working copy makes the repository unbuildable on every machine that lacks it.
# Keep it per-machine in a user-global `~/.cargo/config.toml` instead:
#
#     [patch."https://github.com/gfx-rs/wgpu"]
#     wgpu = { path = "/abs/path/to/wgpu-contrib/wgpu" }
#     naga = { path = "/abs/path/to/wgpu-contrib/naga" }
#
# where that checkout is wgpu at the rev pinned above with the patch applied.
# Without the override the build simply uses the pinned upstream rev.
